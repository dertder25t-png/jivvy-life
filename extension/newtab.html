<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <a class="gear" href="options.html" title="Settings" aria-label="Settings">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L15 3.5h-4L10.6 6a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 1.7-1l2.4 1 2-3.4zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
  </a>
  <main class="wrap">
    <div id="banner" class="banner" role="status" hidden></div>
    <form id="ask" class="ask" autocomplete="off">
      <textarea id="q" rows="1" spellcheck="true" autofocus
        placeholder="Search, ask, or start a coding job"></textarea>
      <div class="bar">
        <button type="button" id="chip" class="chip" aria-haspopup="true" aria-expanded="false"></button>
        <span id="hint" class="hint"></span>
      </div>
      <div id="menu" class="menu" hidden></div>
    </form>
    <div id="pills" class="pills" hidden></div>
    <div id="files" class="files" hidden></div>
    <section id="drawer" class="drawer" role="region" aria-label="Predictive moves" hidden></section>
    <p class="keys muted">Enter sends · Shift+Enter new line · Tab picks a route (on an empty box: the first move) · Alt+1–9 moves · prefixes: <code>!s</code> <code>!ask</code> <code>!deep</code> <code>!code</code> <code>!plan</code> <code>!fix</code></p>
    <section id="widgets" class="widgets"></section>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="newtab.js"></script>
</body>
</html>
